name: Adoption Index CI and deployment
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: kce_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d kce_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/kce_test
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.0
          cache: npm
          cache-dependency-path: |
            site/package-lock.json
            backend/package-lock.json
      - name: Install backend dependencies
        run: npm ci --prefix backend
      - name: Run backend tests against disposable PostgreSQL
        run: npm test --prefix backend
      - name: Install site dependencies
        run: npm ci --prefix site
      - name: Run site tests
        run: npm test --prefix site
      - name: Build site
        run: npm run build --prefix site
  deploy:
    name: deploy
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: checks
    permissions:
      contents: write
    uses: KadenaNexus/homepage/.github/workflows/deploy-app.yml@main
    with:
      url: https://adoption.kadena.ws/
    secrets: inherit
